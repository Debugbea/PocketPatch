<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocket Patch - Add Purchase</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Pocket Patch</h1>
      <p class="subtitle">Add a purchase + item details</p>
    </header>

    <section class="card">
      <h2>Purchase Info</h2>

      <form id="purchaseForm" autocomplete="off">
        <div class="grid">
          <label>
            Store
            <input id="store" type="text" placeholder="e.g., Walmart" required />
          </label>

          <label>
            Date
            <input id="date" type="date" required />
          </label>

          <label>
            Total ($)
            <input id="total" type="number" step="0.01" min="0" placeholder="0.00" required />
          </label>

          <label>
            Notes (optional)
            <input id="notes" type="text" placeholder="coupon used, etc." />
          </label>
        </div>
        <label>
           Receipt Photo (optional)
          <input id="receiptImg" type="file" accept="image/*" />
        </label>

        <div class="preview-wrap">
          <img id="receiptPreview" alt="Receipt preview" />
        </div>

        <hr class="divider" />
        <h3>Add Items</h3>

        <hr class="divider" />

        <h3>Add Items</h3>

        <div class="items-row">
          <input id="itemName" type="text" placeholder="Item name (e.g., Milk)" />
          <input id="itemQty" type="number" min="1" value="1" />
          <input id="itemPrice" type="number" step="0.01" min="0" placeholder="Price" />
          <select id="itemCategory">
            <option value="Groceries">Groceries</option>
            <option value="Household">Household</option>
            <option value="Personal Care">Personal Care</option>
            <option value="Clothing">Clothing</option>
            <option value="Auto Parts">Auto Parts</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
          <button type="button" id="addItemBtn">Add</button>
        </div>

        <ul id="itemsList" class="items-list"></ul>

        <div class="actions">
          <button type="submit" class="primary">Save Purchase</button>
          <button type="button" id="clearBtn" class="secondary">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Saved Purchases</h2>
      <div id="savedWrap" class="saved-wrap"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

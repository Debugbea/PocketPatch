
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pocket Patch</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <section class="welcome">
    <div class="logo">
      <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
        <rect x="80" y="20" width="72" height="88" rx="8" fill="#f6fff9" stroke="#006b3f" stroke-width="8" transform="rotate(-10 116 64)"/>
        <text x="103" y="82" font-size="48" font-weight="900" fill="#007a47">$</text>
        <path d="M45 80 H175 V128 C175 168 145 195 110 205 C75 195 45 168 45 128 Z" fill="#35c46b" stroke="#006b3f" stroke-width="8"/>
        <path d="M55 92 C85 110 135 110 165 92" fill="none" stroke="#007a47" stroke-width="6" stroke-dasharray="10 8"/>
        <rect x="103" y="125" width="58" height="36" rx="10" fill="#f6fff9" stroke="#007a47" stroke-width="5" transform="rotate(-35 132 143)"/>
        <rect x="122" y="134" width="18" height="18" fill="#7be495" transform="rotate(-35 131 143)"/>
      </svg>
    </div>

    <h1>Welcome to<br>Pocket Patch</h1>
    <p class="tagline">Let’s patch the holes in your money</p>

    <button onclick="showApp()">Get Started</button>

    <div class="features">
      <div>💵 <span>Income Setup</span></div>
      <div>🧾 <span>Bills & Expenses</span></div>
      <div>📅 <span>Paycheck Planner</span></div>
      <div>❓ <span>Can I Afford This?</span></div>
    </div>
  </section>

  <section id="tracker" class="tracker hidden">
    <h2>Pocket Patch</h2>
    <p>Add purchases and track spending</p>

    <form id="purchaseForm">
      <input id="store" type="text" placeholder="Store name" required />
      <input id="date" type="date" required />
      <input id="total" type="number" placeholder="Total $" step="0.01" required />
      <input id="notes" type="text" placeholder="Notes" />

      <h3>Add Item</h3>

      <input id="itemName" type="text" placeholder="Item name" />
      <input id="itemQty" type="number" value="1" />
      <input id="itemPrice" type="number" placeholder="Price" step="0.01" />

      <select id="itemCategory">
        <option>Groceries</option>
        <option>Household</option>
        <option>Personal Care</option>
        <option>Bills</option>
        <option>Other</option>
      </select>

      <button type="button" id="addItemBtn">Add Item</button>

      <ul id="itemsList"></ul>

      <button type="submit">Save Purchase</button>
      <button type="button" id="clearBtn" class="secondary">Clear</button>
    </form>

    <h3>Saved Purchases</h3>
    <div id="savedWrap"></div>
  </section>

</div>

<script src="app.js?v=10"></script>
</body>
</html>
